{% extends 'admin/base.html' %}{% block title %}Website Settings{% endblock %}{% block content %}<div class="admin-title"><div><p class="kicker">CONTENT MANAGEMENT</p><h1>Website settings</h1></div></div><form method="post" class="panel form-panel settings-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="form-grid"><label class="wide">Announcement bar<input name="announcement" value="{{ values.announcement }}"></label><label>Hero title<input name="hero_title" value="{{ values.hero_title }}"></label><label>Free-delivery threshold<input type="number" name="free_delivery_threshold" value="{{ values.free_delivery_threshold }}"></label><label class="wide">Hero subtitle<textarea name="hero_subtitle">{{ values.hero_subtitle }}</textarea></label><label>Contact email<input type="email" name="contact_email" value="{{ values.contact_email }}"></label><label>Contact phone<input name="contact_phone" value="{{ values.contact_phone }}"></label><label>Instagram URL<input name="instagram" value="{{ values.instagram }}"></label></div><button class="primary-action">Save settings</button></form>{% endblock %}
