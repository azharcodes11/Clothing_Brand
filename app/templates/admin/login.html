<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AUREN Administration</title><link rel="stylesheet" href="{{ url_for('static',filename='css/admin.css') }}"></head><body class="admin-login"><main><section><a class="admin-logo" href="{{ url_for('store.home') }}">AUREN<small>ADMINISTRATION</small></a><p>Protected access for authorised team members.</p>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="notice {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Email address<input type="email" name="email" autocomplete="username" required></label><label>Password<input type="password" name="password" autocomplete="current-password" required></label><button>Sign in securely</button></form><a href="{{ url_for('store.home') }}">← Return to storefront</a></section></main></body></html>
